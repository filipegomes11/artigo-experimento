# Este HPA está desabilitado por padrão
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fortio-server
  namespace: app
spec:
  minReplicas: 3
  maxReplicas: 6
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fortio-server
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
